<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nest">
<title>Nest — Household Money</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c11; --bg2:#0e1118; --s1:#12161f; --s2:#171c27; --s3:#1d2330; --line:rgba(255,255,255,.065); --line2:rgba(255,255,255,.11);
  --tx:#eef1f6; --tx2:#a9b1c2; --tx3:#6f788b;
  --gold:#e8c27c; --gold2:#c99a4a; --green:#3fd69a; --red:#ff6a6a; --amber:#ffb84d; --blue:#6aa8ff; --violet:#9d8cff; --teal:#40c9c9; --pink:#ff86b7;
  --need:#6aa8ff; --want:#e8c27c; --debt:#ff8a7a; --biz:#9d8cff; --fee:#8a93a6; --save:#3fd69a;
  --r:18px; --r2:12px; --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 20px 40px -24px rgba(0,0,0,.6);
  --serif:'Instrument Serif',Georgia,serif; --sans:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(232,194,124,.08),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(106,168,255,.06),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--gold)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.muted{color:var(--tx2)} .dim{color:var(--tx3)}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)} .goldt{color:var(--gold)}


#lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:
  radial-gradient(800px 600px at 50% -20%,rgba(232,194,124,.14),transparent 60%),var(--bg)}
.lockcard{width:100%;max-width:420px;text-align:center}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#f3d79f,#b8863a);display:grid;place-items:center;box-shadow:0 8px 24px -8px rgba(232,194,124,.6)}
.logo svg{width:22px;height:22px}
.lockcard .logo{width:64px;height:64px;border-radius:20px;margin:0 auto 22px}
.lockcard .logo svg{width:34px;height:34px}
.lockcard h1{font-family:var(--serif);font-size:44px;font-weight:400;letter-spacing:-.02em}
.lockcard p{color:var(--tx2);margin:6px 0 28px}
.field{width:100%;background:var(--s1);border:1px solid var(--line2);border-radius:14px;padding:15px 16px;outline:none;transition:.2s}
.field:focus{border-color:rgba(232,194,124,.6);box-shadow:0 0 0 4px rgba(232,194,124,.12)}
#pass{text-align:center;letter-spacing:.12em;font-size:16px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;font-weight:600;font-size:13.5px;transition:.18s;white-space:nowrap}
.btn-gold{background:linear-gradient(180deg,#f0cf8f,#d3a453);color:#1b1407;box-shadow:0 10px 24px -12px rgba(232,194,124,.7)}
.btn-gold:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--s2);border:1px solid var(--line2)}
.btn-ghost:hover{background:var(--s3)}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn-block{width:100%;padding:15px;margin-top:12px;font-size:15px;border-radius:14px}
.check{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:16px;color:var(--tx2);font-size:13px;cursor:pointer}
.check input{accent-color:var(--gold);width:16px;height:16px}
.lockerr{color:var(--red);min-height:20px;margin-top:10px;font-size:13px}
.lockfoot{margin-top:28px;font-size:12px;color:var(--tx3);display:flex;gap:6px;align-items:center;justify-content:center}


#app{position:relative;z-index:1;display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;background:rgba(10,12,17,.6);backdrop-filter:blur(20px)}
.side .brand{padding:0 8px}
.brand b{font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:-.01em}
.brand small{display:block;color:var(--tx3);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:-2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);padding:14px 12px 6px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--tx2);font-weight:500;text-align:left;transition:.15s;position:relative}
.nav button svg{width:18px;height:18px;flex:none;opacity:.85}
.nav button:hover{background:var(--s1);color:var(--tx)}
.nav button.on{background:linear-gradient(90deg,rgba(232,194,124,.13),rgba(232,194,124,.03));color:var(--tx)}
.nav button.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold)}
.nav button.on svg{color:var(--gold);opacity:1}
.nav .badge{margin-left:auto;font-size:10.5px;padding:2px 7px;border-radius:20px;background:rgba(255,106,106,.15);color:var(--red);font-weight:600}
.side .foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);font-size:12px;color:var(--tx2)}
.side .foot b{color:var(--tx);font-weight:600}
main{min-width:0;padding:26px 34px 60px;max-width:1280px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.top h2{font-family:var(--serif);font-weight:400;font-size:38px;letter-spacing:-.02em;line-height:1.05}
.top .sub{color:var(--tx2);margin-top:4px}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mtop{display:none}


.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-hero{grid-template-columns:1.35fr 1fr}
.card{background:linear-gradient(180deg,var(--s1),rgba(18,22,31,.85));border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0;position:relative}
.card h3{font-size:13px;font-weight:600;color:var(--tx2);letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card h3 svg,.kpi .l svg,.row svg,.btn svg,.li .btn svg{width:16px;height:16px;flex:none}
.card h3 .r{margin-left:auto;font-weight:500;color:var(--tx3);font-size:12px}
.card h4{font-size:15px;font-weight:600;margin-bottom:4px}
.kpi .l{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-family:var(--serif);letter-spacing:-.01em;margin-top:6px;line-height:1.1}
.kpi .s{font-size:12px;color:var(--tx3);margin-top:4px}
.sp{height:16px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:30px;font-size:12px;font-weight:600}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 25%,transparent)}
.p-green{background:rgba(63,214,154,.12);color:var(--green)} .p-amber{background:rgba(255,184,77,.12);color:var(--amber)} .p-red{background:rgba(255,106,106,.13);color:var(--red)} .p-gray{background:var(--s3);color:var(--tx2)} .p-gold{background:rgba(232,194,124,.12);color:var(--gold)} .p-violet{background:rgba(157,140,255,.13);color:var(--violet)} .p-blue{background:rgba(106,168,255,.12);color:var(--blue)}
.tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;letter-spacing:.02em;text-transform:uppercase}


.hero{padding:26px;overflow:hidden;background:
  radial-gradient(600px 300px at 100% 0%,rgba(232,194,124,.12),transparent 60%),linear-gradient(180deg,#151a25,#10141c)}
.hero.red{background:radial-gradient(600px 300px at 100% 0%,rgba(255,106,106,.16),transparent 60%),linear-gradient(180deg,#1a1418,#10141c)}
.hero.amber{background:radial-gradient(600px 300px at 100% 0%,rgba(255,184,77,.14),transparent 60%),linear-gradient(180deg,#181610,#10141c)}
.hero .big{font-family:var(--serif);font-size:76px;line-height:1;letter-spacing:-.03em;margin:14px 0 6px}
.hero .big small{font-size:26px;color:var(--tx2);margin-left:4px}
.hero .meta{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.hero .meta div{min-width:110px}
.hero .meta .l{font-size:11.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em}
.hero .meta .v{font-size:19px;font-weight:600;margin-top:3px}


.bar{height:8px;border-radius:8px;background:var(--s3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:8px;background:var(--gold);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx);opacity:.5;border-radius:2px}
.env{padding:14px 0;border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:0}
.env .top2{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.env .nm{font-weight:600}
.env .amt{margin-left:auto;text-align:right;font-size:13px}
.env .foot2{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--tx3)}
.env input.inl{width:84px;background:var(--s2);border:1px solid var(--line2);border-radius:8px;padding:5px 8px;text-align:right;outline:none}
.env input.inl:focus{border-color:var(--gold)}


.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.ic svg{width:17px;height:17px}
.li .t{min-width:0;flex:1}
.li .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:12px;color:var(--tx3)}
.li .a{text-align:right;font-weight:600;white-space:nowrap}
.li .a small{display:block;font-weight:400;font-size:11.5px;color:var(--tx3)}
.dayhead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:16px 2px 4px;display:flex;justify-content:space-between}


table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line2)}


.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--s3);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}


label.f{display:block;font-size:12px;color:var(--tx2);margin-bottom:12px}
label.f span{display:block;margin-bottom:6px}
.in{width:100%;background:var(--s2);border:1px solid var(--line2);border-radius:11px;padding:11px 12px;outline:none}
.in:focus{border-color:rgba(232,194,124,.6)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=range]{width:100%;accent-color:var(--gold)}
.switch{position:relative;width:40px;height:23px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch i{position:absolute;inset:0;border-radius:20px;background:var(--s3);border:1px solid var(--line2);transition:.2s}
.switch i::after{content:"";position:absolute;width:17px;height:17px;left:2px;top:2px;border-radius:50%;background:#cfd5e0;transition:.2s}
.switch input:checked+i{background:var(--gold2);border-color:var(--gold)}
.switch input:checked+i::after{transform:translateX(17px);background:#fff}


.ins{display:flex;gap:14px;padding:16px;border-radius:14px;background:var(--s2);border:1px solid var(--line)}
.ins .ic{width:38px;height:38px}
.ins b{display:block;font-weight:600;margin-bottom:3px}
.ins p{color:var(--tx2);font-size:13px}


.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#0b0e14;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;z-index:5;box-shadow:0 10px 30px -10px #000}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--tx2);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}


.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:10.5px;color:var(--tx3);text-align:center;letter-spacing:.08em;text-transform:uppercase;padding-bottom:4px}
.cal .d{min-height:84px;border-radius:11px;background:var(--s2);border:1px solid var(--line);padding:7px;font-size:11px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal .d.o{opacity:.35}
.cal .d.t{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cal .d.rz{background:linear-gradient(180deg,rgba(255,106,106,.12),var(--s2))}
.cal .d .n{font-weight:600;color:var(--tx2);display:flex;justify-content:space-between}
.cal .ev{border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}
.cal .ev.in{background:rgba(63,214,154,.14);color:var(--green)} .cal .ev.out{background:rgba(255,255,255,.05);color:var(--tx2)}


.fab{position:fixed;right:26px;bottom:26px;z-index:20;width:58px;height:58px;border-radius:18px;background:linear-gradient(180deg,#f0cf8f,#d3a453);color:#1b1407;display:grid;place-items:center;box-shadow:0 18px 40px -12px rgba(232,194,124,.7)}
.fab svg{width:24px;height:24px}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,4,7,.6);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.sheet{width:100%;max-width:460px;background:var(--s1);border:1px solid var(--line2);border-radius:22px;padding:22px;max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:28px;margin-bottom:4px}
.sheet .sub{color:var(--tx2);margin-bottom:18px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{padding:7px 11px;border-radius:30px;background:var(--s2);border:1px solid var(--line2);font-size:12.5px;color:var(--tx2)}
.chip.on{background:rgba(232,194,124,.14);border-color:rgba(232,194,124,.5);color:var(--gold)}
.amtin{font-family:var(--serif);font-size:54px;text-align:center;background:none;border:0;outline:none;width:100%;letter-spacing:-.02em}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:60;background:#f3f5f9;color:#111;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 20px 40px -10px #000;animation:up .25s}
.view{animation:fade .25s}
.empty{padding:26px;text-align:center;color:var(--tx3);font-size:13px}
.note{font-size:12px;color:var(--tx3);line-height:1.5}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.hl{padding:14px 16px;border-radius:14px;border:1px solid rgba(232,194,124,.25);background:rgba(232,194,124,.06)}
.hl.red{border-color:rgba(255,106,106,.3);background:rgba(255,106,106,.07)}
.hl.green{border-color:rgba(63,214,154,.3);background:rgba(63,214,154,.06)}
.scrollx{overflow-x:auto}
.mnav,.more{display:none}


@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-hero{grid-template-columns:1fr} }
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:calc(14px + var(--safe-t)) 16px calc(110px + var(--safe-b))}
  .top{display:none}
  .mtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .mtop h2{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.02em;line-height:1}
  .mtop .sub{color:var(--tx3);font-size:12px;margin-top:3px}
  .g2,.g3{grid-template-columns:1fr} .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{gap:12px}
  .card{padding:16px;border-radius:16px}
  .hero{padding:20px}
  .hero .big{font-size:62px}
  .hero .meta{gap:14px}
  .hero .meta div{min-width:44%}
  .kpi .v{font-size:23px}
  .mnav{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:30;background:rgba(18,22,31,.86);backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line2);border-radius:22px;padding:6px;justify-content:space-around;box-shadow:0 20px 40px -10px rgba(0,0,0,.8)}
  .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;font-size:10.5px;color:var(--tx3);font-weight:600}
  .mnav button svg{width:21px;height:21px}
  .mnav button.on{color:var(--gold);background:rgba(232,194,124,.08)}
  .mnav .plus{flex:none;width:52px;height:52px;margin-top:-2px;background:linear-gradient(180deg,#f0cf8f,#d3a453);color:#1b1407;border-radius:16px;justify-content:center}
  .mnav .plus svg{width:24px;height:24px}
  .fab{display:none}
  .more{display:block}
  .scrim{align-items:flex-end;padding:0}
  .sheet{border-radius:24px 24px 0 0;max-width:none;padding:20px 18px calc(24px + var(--safe-b))}
  .cal .d{min-height:58px;padding:5px} .cal .ev{font-size:9px;padding:0 3px}
  .hide-m{display:none!important}
  td,th{padding:9px 6px}
}
@media (min-width:861px){ .show-m{display:none!important} }
</style>
</head>
<body>

<div id="lock">
  <div class="lockcard">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#1b1407" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></div>
    <h1>Nest</h1>
    <p>Your household money, privately encrypted.</p>
    <form id="lockform" autocomplete="off">
      <input id="pass" class="field" type="password" placeholder="XXXXX-XXXXX-XXXXX-XXXXX" autocapitalize="characters" spellcheck="false" autocomplete="current-password">
      <button class="btn btn-gold btn-block" id="unlockbtn" type="submit">Unlock</button>
