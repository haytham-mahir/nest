<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#08090d">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nest">
<title>Nest — Household Money</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090d;--s0:#0d0f15;--s1:#12151d;--s2:#181c26;--s3:#20252f;--line:rgba(255,255,255,.06);--line2:rgba(255,255,255,.1);
  --tx:#f2f4f8;--tx2:#a8b0c0;--tx3:#6b7486;
  --gold:#e9c784;--gold2:#c8994a;--gold3:#f6e2b6;--green:#45d6a0;--red:#ff6b6b;--amber:#ffb44d;--blue:#71a9ff;--violet:#a493ff;
  --need:#71a9ff;--want:#e9c784;--debt:#ff8f7f;--biz:#a493ff;--fee:#8a93a6;--save:#45d6a0;
  --serif:'Instrument Serif',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
  --r:22px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100dvh;background:var(--bg);color:var(--tx);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1;overflow-x:hidden;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select{font-size:16px}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.015em}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amber)}.goldt{color:var(--gold)}
svg{flex:none}

.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5}
.orbs i:nth-child(1){width:520px;height:520px;right:-180px;top:-220px;background:radial-gradient(circle,rgba(233,199,132,.28),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
.orbs i:nth-child(2){width:460px;height:460px;left:-200px;bottom:-200px;background:radial-gradient(circle,rgba(113,169,255,.16),transparent 70%);animation:drift 26s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-60px,40px) scale(1.1)}}

#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .6s var(--ease),visibility .6s}
#splash.out{opacity:0;visibility:hidden}
.sp-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.mark{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;position:relative;background:linear-gradient(145deg,#f6dfae,#c48e3e);box-shadow:0 30px 80px -20px rgba(233,199,132,.65),inset 0 1px 0 rgba(255,255,255,.5);animation:pop .9s var(--ease) both}
.mark::after{content:"";position:absolute;inset:-14px;border-radius:38px;border:1px solid rgba(233,199,132,.35);animation:ring 2.4s ease-out infinite}
.mark svg{width:48px;height:48px}
.mark path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1.1s .35s var(--ease) forwards}
.mark path:nth-child(2){animation-delay:.55s}.mark path:nth-child(3){animation-delay:.75s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes ring{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.sp-title{font-family:var(--serif);font-size:48px;letter-spacing:-.02em;line-height:1;animation:fadeup .8s .5s var(--ease) both}
.sp-sub{color:var(--tx3);font-size:13px;letter-spacing:.18em;text-transform:uppercase;animation:fadeup .8s .7s var(--ease) both}
.sp-bar{width:140px;height:2px;border-radius:2px;background:var(--s3);overflow:hidden;margin-top:14px;animation:fadeup .6s .8s both}
.sp-bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}}

#lock{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;padding-bottom:calc(24px + var(--sb))}
.lockcard{width:100%;max-width:380px;text-align:center;animation:fadeup .7s var(--ease) both}
.lockcard .mark{width:72px;height:72px;border-radius:22px;margin:0 auto 22px;animation:none}
.lockcard .mark svg{width:36px;height:36px}.lockcard .mark path{stroke-dashoffset:0;animation:none}
.lockcard h1{font-family:var(--serif);font-weight:400;font-size:42px;letter-spacing:-.02em;line-height:1}
.lockcard p{color:var(--tx2);margin:8px 0 28px;font-size:14px}
.pass{width:100%;height:58px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line2);text-align:center;font-size:17px;letter-spacing:.14em;text-transform:uppercase;outline:none;transition:.2s;backdrop-filter:blur(10px)}
.pass:focus{border-color:rgba(233,199,132,.6);box-shadow:0 0 0 5px rgba(233,199,132,.1)}
.pass.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.check{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:18px;color:var(--tx2);font-size:14px;cursor:pointer}
.check input{accent-color:var(--gold);width:18px;height:18px}
.lockerr{color:var(--red);min-height:20px;margin-top:12px;font-size:13px}
.lockfoot{margin-top:26px;font-size:12px;color:var(--tx3);display:flex;gap:6px;align-items:center;justify-content:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;height:44px;padding:0 18px;font-weight:600;font-size:14px;transition:transform .15s,filter .15s,background .15s;white-space:nowrap;user-select:none}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
.gold{background:linear-gradient(180deg,#f3d496,#d2a253);color:#1d1508;box-shadow:0 12px 30px -14px rgba(233,199,132,.8),inset 0 1px 0 rgba(255,255,255,.45)}
.ghost{background:rgba(255,255,255,.05);border:1px solid var(--line2)}
.sm{height:36px;padding:0 13px;font-size:13px;border-radius:11px}
.block{width:100%;height:56px;font-size:16px;border-radius:18px;margin-top:14px}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.icon-btn svg{width:19px;height:19px}

#app{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;padding:26px 16px;display:flex;flex-direction:column;gap:30px;border-right:1px solid var(--line);background:rgba(8,9,13,.55);backdrop-filter:blur(24px)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand .mark{width:40px;height:40px;border-radius:13px;animation:none;box-shadow:0 10px 30px -10px rgba(233,199,132,.6)}
.brand .mark::after,.lockcard .mark::after{display:none}
.brand .mark svg{width:21px;height:21px}.brand .mark path{stroke-dashoffset:0;animation:none}
.brand b{font-family:var(--serif);font-weight:400;font-size:27px;letter-spacing:-.01em;display:block;line-height:1}
.brand small{font-size:10.5px;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:13px;height:46px;padding:0 14px;border-radius:14px;color:var(--tx2);font-weight:500;font-size:14.5px;transition:.2s}
.nav button svg{width:20px;height:20px}
.nav button:hover{background:rgba(255,255,255,.04);color:var(--tx)}
.nav button.on{background:linear-gradient(90deg,rgba(233,199,132,.16),rgba(233,199,132,.02));color:var(--tx);box-shadow:inset 0 0 0 1px rgba(233,199,132,.12)}
.nav button.on svg{color:var(--gold)}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:auto;box-shadow:0 0 0 4px rgba(255,107,107,.18)}
.sidecard{margin-top:auto;padding:16px;border-radius:18px;background:var(--s1);border:1px solid var(--line);font-size:13px}
.sidecard .l{color:var(--tx3);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sidecard .v{font-family:var(--serif);font-size:30px;margin:2px 0 8px}

main{min-width:0;width:100%;max-width:1160px;padding:30px 40px 80px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.head h1{font-family:var(--serif);font-weight:400;font-size:40px;letter-spacing:-.02em;line-height:1.05}
.head .sub{color:var(--tx3);font-size:13.5px;margin-top:4px}
.head .acts{display:flex;gap:10px;align-items:center}

.segs{display:flex;gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:20px;overflow-x:auto;scrollbar-width:none;width:max-content;max-width:100%}
.segs::-webkit-scrollbar{display:none}
.segs button{height:38px;padding:0 16px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:.2s}
.segs button.on{background:var(--s3);color:var(--tx);box-shadow:0 4px 14px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.mini-seg{display:inline-flex;gap:3px;padding:3px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.mini-seg button{height:30px;padding:0 11px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--tx2)}
.mini-seg button.on{background:var(--s3);color:var(--tx)}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gh{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.card{position:relative;min-width:0;border-radius:var(--r);padding:22px;background:linear-gradient(180deg,rgba(24,28,38,.92),rgba(16,19,26,.92));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 50px -30px rgba(0,0,0,.8)}
.card.tap{cursor:pointer;transition:transform .2s var(--ease),border-color .2s}
.card.tap:active{transform:scale(.985)}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px;min-height:24px}
.ch h3{font-size:14px;font-weight:600;color:var(--tx)}
.ch .r{margin-left:auto;color:var(--tx3);font-size:12.5px;display:flex;align-items:center;gap:6px}
.ch svg{width:17px;height:17px;color:var(--gold)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.big{font-family:var(--serif);letter-spacing:-.03em;line-height:1}
.stat .l{font-size:12px;color:var(--tx3)}
.stat .v{font-family:var(--serif);font-size:26px;letter-spacing:-.01em;line-height:1.15;margin-top:3px}
.stat .s{font-size:12px;color:var(--tx3);margin-top:2px}
.sp{height:16px}.sp2{height:26px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:20px;font-size:12px;font-weight:600}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
.c-green{background:rgba(69,214,160,.12);color:var(--green)}.c-amber{background:rgba(255,180,77,.12);color:var(--amber)}.c-red{background:rgba(255,107,107,.13);color:var(--red)}.c-gold{background:rgba(233,199,132,.12);color:var(--gold)}.c-gray{background:rgba(255,255,255,.06);color:var(--tx2)}.c-violet{background:rgba(164,147,255,.14);color:var(--violet)}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px}

.hero{padding:28px;overflow:hidden;background:radial-gradient(500px 280px at 100% 0%,rgba(233,199,132,.16),transparent 65%),linear-gradient(180deg,#171b25,#0f1218)}
.hero.red{background:radial-gradient(500px 280px at 100% 0%,rgba(255,107,107,.2),transparent 65%),linear-gradient(180deg,#1b1519,#0f1218)}
.hero.amber{background:radial-gradient(500px 280px at 100% 0%,rgba(255,180,77,.16),transparent 65%),linear-gradient(180deg,#1a1712,#0f1218)}
.hero-in{display:flex;align-items:center;gap:26px}
.ring{position:relative;width:168px;height:168px;flex:none}
.ring svg{width:100%;height:100%}
.gring{position:relative;width:76px;height:76px;flex:none}.gring svg{width:100%;height:100%}.gring .rc{position:absolute;inset:0;display:grid;place-items:center}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .rv{font-family:var(--serif);font-size:44px;line-height:1;letter-spacing:-.03em}
.ring .rl{font-size:11px;color:var(--tx3);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .arc{transition:stroke-dashoffset 1.2s var(--ease)}
.hero-txt{min-width:0;flex:1}
.hero-txt .big{font-size:64px;margin:10px 0 8px}
.hero-txt .big small{font-size:22px;color:var(--tx2);margin-left:4px;letter-spacing:0}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.trio .l{font-size:11px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase}
.trio .v{font-size:18px;font-weight:600;margin-top:3px}

.alert{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-radius:18px;margin-bottom:16px;border:1px solid rgba(255,107,107,.28);background:rgba(255,107,107,.08)}
.alert svg{width:20px;height:20px;color:var(--red);margin-top:1px}
.alert b{display:block;font-size:14px}
.alert p{font-size:13px;color:var(--tx2);margin-top:2px}
.alert.ag{border-color:rgba(233,199,132,.3);background:rgba(233,199,132,.07);cursor:pointer}
.alert.ag svg{color:var(--gold)}
.alert.green{border-color:rgba(69,214,160,.3);background:rgba(69,214,160,.07)}.alert.green svg{color:var(--green)}

.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:8px;background:var(--gold);transform-origin:left;animation:grow .9s var(--ease) both}
.bar .mk{position:absolute;top:-2px;bottom:-2px;width:2px;border-radius:2px;background:rgba(255,255,255,.55)}
@keyframes grow{from{transform:scaleX(0)}}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line);min-width:0;width:100%;text-align:left}
.li:last-child{border-bottom:0}
button.li{cursor:pointer}
button.li:active{opacity:.7}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:14px;font-weight:700}
.ic svg{width:18px;height:18px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{display:block;font-size:12.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .a{text-align:right;font-weight:600;font-size:14.5px;white-space:nowrap}
.li .a small{display:block;font-weight:400;font-size:12px;color:var(--tx3)}
.li .chev{width:16px;height:16px;color:var(--tx3)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.dh:first-child{padding-top:0}

.env{padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;display:block;cursor:pointer}
.env:last-child{border-bottom:0}
.env .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.env .nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.env .meta{font-size:12px;color:var(--tx3)}
.env .amt{margin-left:auto;text-align:right;font-size:14px;white-space:nowrap}
.env .foot{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--tx3);gap:10px}

.kv{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:12px;font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{white-space:nowrap}

.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:2px 22px 4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:0 0 min(300px,82%)}
.ins{padding:18px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.ins .ic{width:38px;height:38px;border-radius:12px}
.ins b{font-size:15px;font-weight:600;line-height:1.3}
.ins p{font-size:13px;color:var(--tx2);line-height:1.5}

.chart{position:relative;width:100%;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.ctip{position:absolute;top:0;pointer-events:none;background:rgba(10,12,17,.94);border:1px solid var(--line2);border-radius:12px;padding:8px 11px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .15s;z-index:4;box-shadow:0 12px 30px -10px #000;backdrop-filter:blur(10px)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;color:var(--tx2);margin-top:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:10.5px;color:var(--tx3);text-align:center;font-weight:600;padding-bottom:4px}
.cal .d{min-height:78px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:6px;font-size:11px;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0}
.cal .d.o{opacity:.3}.cal .d.t{border-color:var(--gold)}.cal .d.rz{background:rgba(255,107,107,.08)}
.cal .n{font-weight:600;color:var(--tx2)}
.cal .ev{border-radius:5px;padding:1px 4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .in{background:rgba(69,214,160,.15);color:var(--green)}.cal .out{background:rgba(255,255,255,.06);color:var(--tx2)}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap}.cal .dots i{width:6px;height:6px;border-radius:50%}

label.f{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:14px}
label.f>span{display:block;margin-bottom:7px}
label.f>span.between{display:flex}
.li .t b .tag{display:inline-block;vertical-align:2px;margin-left:4px}
.in{width:100%;height:50px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:14px;padding:0 14px;outline:none;font-size:16px;transition:border-color .2s}
.in:focus{border-color:rgba(233,199,132,.6)}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--gold) var(--p,50%),rgba(255,255,255,.08) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.5),0 0 0 4px rgba(233,199,132,.35)}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:rgba(255,255,255,.08)}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--gold)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff}
.switch{position:relative;width:48px;height:28px;flex:none;display:inline-block}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;border-radius:20px;background:rgba(255,255,255,.1);transition:.25s}
.switch i::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#dfe3ea;transition:.25s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.switch input:checked+i{background:var(--gold2)}
.switch input:checked+i::after{transform:translateX(20px);background:#fff}

.mhead,.mnav{display:none}
.fab{position:fixed;right:30px;bottom:30px;z-index:20;width:60px;height:60px;border-radius:20px;display:grid;place-items:center}
.fab svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(3,4,7,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s both}
.scrim.closing{animation:fadeout .22s both}
.sheet{width:100%;max-width:460px;max-height:min(88dvh,820px);overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(180deg,#191d27,#12151c);border:1px solid var(--line2);border-radius:28px;padding:24px;box-shadow:0 40px 80px -20px rgba(0,0,0,.8);animation:up .38s var(--ease) both}
.scrim.closing .sheet{animation:down .22s both}
.grab{width:42px;height:5px;border-radius:5px;background:rgba(255,255,255,.18);margin:-8px auto 16px;display:none}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.015em;line-height:1.1}
.sheet .sub{color:var(--tx2);font-size:13.5px;margin:6px 0 20px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes down{to{transform:translateY(60px);opacity:0}}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
.amount{font-family:var(--serif);font-size:64px;text-align:center;letter-spacing:-.03em;line-height:1;padding:10px 0 4px;min-height:80px}
.amount .cur{color:var(--tx3);font-size:36px;vertical-align:14px;margin-right:2px}
.amount.zero{color:var(--tx3)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{height:56px;border-radius:16px;background:rgba(255,255,255,.05);font-size:22px;font-weight:500;transition:background .1s,transform .1s}
.pad button:active{background:rgba(255,255,255,.12);transform:scale(.96)}
.pad svg{width:22px;height:22px;margin:auto}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -24px;padding-left:24px;padding-right:24px}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;height:38px;padding:0 14px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--line2);font-size:13px;color:var(--tx2);display:inline-flex;align-items:center;gap:7px}
.chipb svg{width:15px;height:15px}
.chipb.on{background:rgba(233,199,132,.15);border-color:rgba(233,199,132,.55);color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(30px + var(--sb));transform:translateX(-50%);z-index:80;background:rgba(246,247,250,.97);color:#111;padding:12px 18px;border-radius:16px;font-weight:600;font-size:13.5px;box-shadow:0 20px 40px -10px rgba(0,0,0,.7);animation:toast .35s var(--ease) both;max-width:calc(100% - 40px);text-align:center}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px)}}
.empty{padding:28px 10px;text-align:center;color:var(--tx3);font-size:13.5px}
.note{font-size:12.5px;color:var(--tx3);line-height:1.55}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:46px;margin-top:8px;border-radius:14px;color:var(--gold);font-weight:600;font-size:13.5px;background:rgba(233,199,132,.06)}
.more svg{width:16px;height:16px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .chev{margin-left:auto;transition:transform .25s;width:18px;height:18px;color:var(--tx3)}
details.fold[open]>summary .chev{transform:rotate(180deg)}
details.fold[open]>summary{margin-bottom:12px}

.enter>*{animation:rise .6s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(6){animation-delay:.25s}.enter>*:nth-child(n+7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
#app.reveal{animation:appin .8s var(--ease) both}
@keyframes appin{from{opacity:0;transform:scale(.985)}}

@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.gh{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side,.head,.fab{display:none}
  main{padding:calc(10px + var(--st)) 16px calc(120px + var(--sb))}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:15;margin:0 -16px 14px;padding:calc(12px + var(--st)) 16px 12px;background:linear-gradient(180deg,rgba(8,9,13,.96) 70%,rgba(8,9,13,0));}
  .mhead h1{font-family:var(--serif);font-weight:400;font-size:32px;letter-spacing:-.02em;line-height:1}
  .mhead .sub{font-size:12.5px;color:var(--tx3);margin-top:3px}
  .mhead .acts{display:flex;gap:8px}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;position:fixed;left:12px;right:12px;bottom:calc(12px + var(--sb));z-index:30;height:68px;padding:0 6px;border-radius:24px;background:rgba(20,23,31,.82);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--line2);box-shadow:0 24px 50px -12px rgba(0,0,0,.9)}
  .mnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:56px;border-radius:18px;font-size:10.5px;font-weight:600;color:var(--tx3);transition:color .2s}
  .mnav button svg{width:22px;height:22px;transition:transform .25s var(--ease)}
  .mnav button.on{color:var(--gold)}
  .mnav button.on svg{transform:translateY(-1px) scale(1.06)}
  .mnav .plus{width:56px;height:56px;margin:0 auto;border-radius:19px;color:#1d1508}
  .mnav .plus svg{width:26px;height:26px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{gap:12px}
  .card{padding:18px;border-radius:20px}
  .hscroll{margin:0 -18px;padding:2px 18px 4px}
  .hero{padding:20px}
  .hero-in{flex-direction:column;align-items:stretch;gap:14px}
  .ring{width:100%;height:auto;display:flex;align-items:center;gap:16px}
  .ring svg{width:112px;height:112px}
  .ring .rc{position:static;align-items:flex-start;text-align:left}
  .hero-txt .big{font-size:56px;margin:4px 0 6px}
  .trio .v{font-size:16px}
  .stat .v{font-size:23px}
  .segs{width:100%;margin-bottom:16px}
  .segs button{flex:1;padding:0 10px}
  .scrim{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:28px 28px 0 0;padding:20px 20px calc(20px + var(--sb));max-height:92dvh;animation:sheetup .42s var(--ease) both}
  .scrim.closing .sheet{animation:sheetdown .25s both}
  .chips{margin:0 -20px;padding-left:20px;padding-right:20px}
  .grab{display:block}
  .cal .d{min-height:52px;padding:4px;border-radius:9px}
  .hide-m{display:none!important}
  .toast{bottom:calc(96px + var(--sb))}
}
@keyframes sheetup{from{transform:translateY(100%)}}
@keyframes sheetdown{to{transform:translateY(100%)}}
@media (min-width:821px){.show-m{display:none!important}.hscroll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;margin:0;padding:0}.hscroll>*:nth-child(n+4){display:none}}
@media (hover:hover){.card.tap:hover{border-color:rgba(233,199,132,.25)}.btn:hover{filter:brightness(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
